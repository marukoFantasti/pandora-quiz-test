    // ─── DrawCanvas ───────────────────────────────────────────
    function DrawCanvas({ id, height=120, label="✏️ ここに書こう", canvasRef: externalRef }) {
      const internalRef = React.useRef(null);
      const canvasRef = externalRef || internalRef;
      const isDrawing = React.useRef(false);
      const lastPos = React.useRef(null);
      const [mode, setMode] = React.useState("pen");
      const modeRef = React.useRef("pen");
      modeRef.current = mode;

      const getPos = (e, canvas) => {
        const rect = canvas.getBoundingClientRect();
        const sx = canvas.width/rect.width, sy = canvas.height/rect.height;
        if(e.touches) return {x:(e.touches[0].clientX-rect.left)*sx, y:(e.touches[0].clientY-rect.top)*sy};
        return {x:(e.clientX-rect.left)*sx, y:(e.clientY-rect.top)*sy};
      };

      const applyStroke = (ctx) => {
        if (modeRef.current === "eraser") {
          ctx.globalCompositeOperation = "destination-out";
          ctx.lineWidth = 22;
        } else {
          ctx.globalCompositeOperation = "source-over";
          ctx.strokeStyle = "#3a2a4a";
          ctx.lineWidth = 3;
        }
        ctx.lineCap = "round"; ctx.lineJoin = "round";
      };

      React.useEffect(() => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle="#fffef7"; ctx.fillRect(0,0,canvas.width,canvas.height);
        applyStroke(ctx);
        const onTS=(e)=>{e.preventDefault();isDrawing.current=true;lastPos.current=getPos(e,canvas);};
        const onTM=(e)=>{e.preventDefault();if(!isDrawing.current)return;const pos=getPos(e,canvas);const c2=canvas.getContext("2d");applyStroke(c2);c2.beginPath();c2.moveTo(lastPos.current.x,lastPos.current.y);c2.lineTo(pos.x,pos.y);c2.stroke();c2.globalCompositeOperation="source-over";lastPos.current=pos;};
        const onTE=(e)=>{e.preventDefault();isDrawing.current=false;};
        canvas.addEventListener("touchstart",onTS,{passive:false});
        canvas.addEventListener("touchmove",onTM,{passive:false});
        canvas.addEventListener("touchend",onTE,{passive:false});
        return()=>{canvas.removeEventListener("touchstart",onTS);canvas.removeEventListener("touchmove",onTM);canvas.removeEventListener("touchend",onTE);};
      },[]);

      const sd=(e)=>{isDrawing.current=true;lastPos.current=getPos(e,canvasRef.current);};
      const dr=(e)=>{if(!isDrawing.current)return;const c=canvasRef.current;const ctx=c.getContext("2d");applyStroke(ctx);const pos=getPos(e,c);ctx.beginPath();ctx.moveTo(lastPos.current.x,lastPos.current.y);ctx.lineTo(pos.x,pos.y);ctx.stroke();ctx.globalCompositeOperation="source-over";lastPos.current=pos;};
      const sp=()=>{isDrawing.current=false;};
      const clear=()=>{const c=canvasRef.current;const ctx=c.getContext("2d");ctx.fillStyle="#fffef7";ctx.fillRect(0,0,c.width,c.height);};

      return (
        <div style={{marginBottom:8}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
            <span style={{fontSize:12,color:"#666",fontWeight:"bold"}}>{label}</span>
            <div style={{display:"flex",gap:6}}>
              <button onClick={()=>setMode("pen")} style={{fontSize:11,color:mode==="pen"?"#fff":"#666",background:mode==="pen"?"#e0729a":"#f5f5f5",border:"1px solid #ddd",borderRadius:6,padding:"2px 8px",cursor:"pointer"}}>✏️ ペン</button>
              <button onClick={()=>setMode("eraser")} style={{fontSize:11,color:mode==="eraser"?"#fff":"#666",background:mode==="eraser"?"#888":"#f5f5f5",border:"1px solid #ddd",borderRadius:6,padding:"2px 8px",cursor:"pointer"}}>🧼 消しゴム</button>
              <button onClick={clear} style={{fontSize:11,color:"#999",background:"none",border:"1px solid #ddd",borderRadius:6,padding:"2px 8px",cursor:"pointer"}}>全消去</button>
            </div>
          </div>
          <canvas ref={canvasRef} width={1200} height={height}
            style={{width:"100%",height:height,borderRadius:10,border:"2px solid #f4c6da",display:"block",touchAction:"none",cursor:mode==="eraser"?"cell":"crosshair"}}
            onMouseDown={sd} onMouseMove={dr} onMouseUp={sp} onMouseLeave={sp}/>
        </div>
      );
    }

    // ─── メインApp ────────────────────────────────────────────
    function App() {
      const [englishOpen, setEnglishOpen] = React.useState({});
      const [submitted, setSubmitted] = React.useState(false);
      const [speaking, setSpeaking] = React.useState(null);
      const [vocabSelected, setVocabSelected] = React.useState({left:null,right:null});
      const [vocabMatched, setVocabMatched] = React.useState({});

      const nameCanvasRef = React.useRef(null);
      const eqRefs = React.useRef({});
      const ansRefs = React.useRef({});
      questions.forEach(q=>{
        if(!eqRefs.current[q.id]) eqRefs.current[q.id]=React.createRef();
        if(!ansRefs.current[q.id]) ansRefs.current[q.id]=React.createRef();
      });

      const vocabPool = React.useMemo(()=>questions.slice(0,6).map(q=>({id:"v"+q.id, en:q.vocab_word, jp:q.vocab_meaning})),[]);
      const shuffledVocabJp = React.useMemo(()=>[...vocabPool].sort(()=>Math.random()-0.5),[]);
      const vocabScore = Object.keys(vocabMatched).filter(k=>!k.startsWith("jp_")).length;

      const handleSpeak = (text, id) => {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang="en-US"; u.rate=0.85;
        setSpeaking(id);
        u.onend=()=>setSpeaking(null);
        window.speechSynthesis.speak(u);
      };

      const toggleEnglish = (id) => setEnglishOpen(p=>({...p,[id]:!p[id]}));

      const handleVocabLeft = (id) => {
        if(vocabMatched[id]) return;
        setVocabSelected(prev=>{
          const newLeft = prev.left===id ? null : id;
          if(newLeft && prev.right){
            const correctJp = vocabPool.find(v=>v.id===newLeft)?.jp;
            const selectedJp = shuffledVocabJp.find(v=>v.id===prev.right)?.jp;
            if(correctJp===selectedJp){
              setVocabMatched(m=>({...m,[newLeft]:true,[`jp_${prev.right}`]:true}));
              return {left:null,right:null};
            }
            return {left:newLeft,right:prev.right};
          }
          return {...prev,left:newLeft};
        });
      };
      const handleVocabRight = (id) => {
        if(vocabMatched[`jp_${id}`]) return;
        setVocabSelected(prev=>{
          const newRight = prev.right===id ? null : id;
          if(prev.left && newRight){
            const correctJp = vocabPool.find(v=>v.id===prev.left)?.jp;
            const selectedJp = shuffledVocabJp.find(v=>v.id===newRight)?.jp;
            if(correctJp===selectedJp){
              setVocabMatched(m=>({...m,[prev.left]:true,[`jp_${newRight}`]:true}));
              return {left:null,right:null};
            }
            return {left:prev.left,right:newRight};
          }
          return {...prev,right:newRight};
        });
      };

      const SUPABASE_URL = "https://upmflhdbhbyzoeldrvvw.supabase.co";
      const SUPABASE_KEY = "sb_publishable_K8Y_bNHVA4szRXFM_EcDkA_LBckunu5";

      const [submitting, setSubmitting] = React.useState(false);
      const [submitError, setSubmitError] = React.useState(null);

      const handleSubmit = async () => {
        setSubmitting(true);
        setSubmitError(null);
        try {
          const sid = new URLSearchParams(location.search).get('sid') || null;
          const nameCanvas = nameCanvasRef.current?.toDataURL("image/png") || null;

          const problemsData = questions.map(q => ({
            problem_id: QUIZ_META.assignment_id + "_q" + q.id,
            unit: q.unit,
            chapter: q.unit,
            level: q.level,
            question: q.jp,
            answer: q.answer_hint,
            tags: [],
            equation_canvas: eqRefs.current[q.id]?.current?.toDataURL("image/png") || null,
            answer_canvas: ansRefs.current[q.id]?.current?.toDataURL("image/png") || null,
            english_opened: !!englishOpen[q.id],
          }));

          const payload = {
            student_id: sid,
            student_name: QUIZ_META.student_name || null,
            assignment_id: QUIZ_META.assignment_id,
            mode: QUIZ_META.mode,
            grade: QUIZ_META.grade,
            subject: "math",
            submission_data: {
              student_id: sid,
              student_name: QUIZ_META.student_name || null,
              problems: problemsData,
              kanji: [],
              name_canvas: nameCanvas,
              vocab_score: vocabScore,
              english_opened_count: Object.values(englishOpen).filter(Boolean).length,
            },
            submitted_at: new Date().toISOString(),
          };

          const res = await fetch(`${SUPABASE_URL}/rest/v1/submissions`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "apikey": SUPABASE_KEY,
              "Authorization": `Bearer ${SUPABASE_KEY}`,
              "Prefer": "return=minimal",
            },
            body: JSON.stringify(payload),
          });

          if(!res.ok) throw new Error(`送信エラー: ${res.status}`);
          setSubmitted(true);
          window.scrollTo({top:0,behavior:"smooth"});
        } catch(e) {
          setSubmitError(e.message);
        } finally {
          setSubmitting(false);
        }
      };

      if(submitted){
        return (
          <div style={{minHeight:"100vh",background:"#fff0f5",paddingBottom:60}}>
            <div style={{background:"linear-gradient(135deg,#ff8fb3,#e0729a)",color:"white",padding:"20px 16px 16px"}}>
              <h1 style={{fontSize:18,fontWeight:"bold",margin:"0 0 4px 0"}}>✅ 提出完了！</h1>
              <p style={{fontSize:12,margin:0,opacity:0.85}}>先生に届いたよ！お疲れさま 🎉</p>
            </div>
            <div style={{padding:"14px 12px"}}>
              <div style={{background:"white",borderRadius:14,marginBottom:12,padding:"14px 12px",boxShadow:"0 2px 6px rgba(0,0,0,0.07)"}}>
                <p style={{fontSize:14,fontWeight:"bold",color:"#e0729a",marginBottom:8}}>📊 結果</p>
                <span style={{background:"#fff3e0",color:"#e6720a",padding:"4px 12px",borderRadius:20,fontSize:13,fontWeight:"bold"}}>単語 {vocabScore}/{vocabPool.length}</span>
                <span style={{background:"#f3e5f5",color:"#7b1fa2",padding:"4px 12px",borderRadius:20,fontSize:13,fontWeight:"bold",marginLeft:8}}>＋English {Object.values(englishOpen).filter(Boolean).length}/10</span>
              </div>
              <button onClick={()=>setSubmitted(false)} style={{width:"100%",background:"#f5f5f5",border:"2px solid #ddd",color:"#666",padding:"14px",borderRadius:14,fontSize:15,cursor:"pointer",fontWeight:"bold"}}>← 戻って直す</button>
            </div>
          </div>
        );
      }

      return (
        <div style={{minHeight:"100vh",background:"#fff0f5",paddingBottom:100,overflowX:"hidden"}}>
          <div style={{background:"linear-gradient(135deg,#ff8fb3,#e0729a)",color:"white",padding:"16px 16px 12px",position:"sticky",top:0,zIndex:100,boxShadow:"0 2px 10px rgba(0,0,0,0.2)"}}>
            <h1 style={{fontSize:17,fontWeight:"bold",margin:"0 0 4px 0"}}>🐰 算数×英語を学ぼう！ふわふわ王国編</h1>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              <span style={{background:"rgba(255,255,255,0.2)",borderRadius:6,padding:"2px 8px",fontSize:11}}>🔢 かけ算のきまり</span>
              <span style={{background:"rgba(255,255,255,0.2)",borderRadius:6,padding:"2px 8px",fontSize:11}}>🌍 英語もチャレンジ</span>
            </div>
          </div>

          <div style={{padding:"12px 12px"}}>
            <div style={{background:"white",borderRadius:14,marginBottom:14,border:"2px solid #ff8fb3",overflow:"hidden",boxShadow:"0 2px 6px rgba(0,0,0,0.07)"}}>
              <div style={{padding:"12px"}}>
                <p style={{fontSize:14,fontWeight:"bold",color:"#e0729a",marginBottom:8}}>✏️ 名前</p>
                <DrawCanvas id="name" height={70} label="名前を書いてね（漢字で）" canvasRef={nameCanvasRef}/>
              </div>
            </div>

            {questions.map((q,idx)=>{
              const isOpen = englishOpen[q.id];
              const badge = LEVEL_BADGE[q.level];
              return (
                <div key={q.id} style={{background:"white",borderRadius:14,marginBottom:14,border:"2px solid #ffd6e5",overflow:"hidden",boxShadow:"0 2px 6px rgba(0,0,0,0.07)"}}>
                  <div style={{padding:"12px"}}>
                    <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap",alignItems:"center"}}>
                      <span style={{background:"#ff8fb3",color:"white",borderRadius:6,padding:"2px 8px",fontSize:12,fontWeight:"bold"}}>Q{idx+1}</span>
                      <span style={{background:"#ffe8f0",color:"#e0729a",borderRadius:6,padding:"2px 8px",fontSize:11}}>{q.unit}</span>
                      <span style={{background:badge.bg,color:badge.color,borderRadius:6,padding:"2px 8px",fontSize:11,fontWeight:"bold"}}>{badge.label}</span>
                      <span style={{background:"#f5f5f5",color:"#888",borderRadius:6,padding:"2px 8px",fontSize:11}}>{q.category}</span>
                    </div>
                    <div style={{display:"flex",gap:10,alignItems:"flex-start",marginBottom:12}}>
                      <div style={{flexShrink:0}}>{illustrations[q.id]}</div>
                      <p style={{fontSize:16,lineHeight:1.8,color:"#222",margin:0,fontWeight:"500",wordBreak:"break-word"}}>{q.jp}</p>
                    </div>
                    <DrawCanvas id={`eq_${q.id}`} height={150} label="📐 式" canvasRef={eqRefs.current[q.id]}/>
                    <DrawCanvas id={`ans_${q.id}`} height={110} label="✍️ 答え" canvasRef={ansRefs.current[q.id]}/>
                    <button onClick={()=>toggleEnglish(q.id)}
                      style={{width:"100%",marginTop:10,padding:"13px 0",borderRadius:12,border:"none",cursor:"pointer",fontWeight:"bold",fontSize:15,
                        background:isOpen?"linear-gradient(135deg,#2e7d32,#1b5e20)":"linear-gradient(135deg,#43a047,#2e7d32)",
                        color:"white",boxShadow:isOpen?"none":"0 3px 10px rgba(67,160,71,0.5)"}}>
                      {isOpen ? "▲ ＋English を閉じる" : "🌍 ＋English　英語もやってみよう！"}
                    </button>
                  </div>

                  {isOpen && (
                    <div style={{borderTop:"3px solid #43a047",background:"#f1f8e9",padding:"14px 12px"}}>
                      <div style={{background:"white",borderRadius:10,padding:"12px",marginBottom:12,border:"1px solid #c5e1a5"}}>
                        <p style={{fontSize:12,color:"#2e7d32",fontWeight:"bold",margin:"0 0 6px 0"}}>💡 この問題のポイント</p>
                        <p style={{fontSize:13,color:"#558b2f",margin:0}}>{q.english_phrase}</p>
                      </div>
                      <div style={{background:"white",borderRadius:10,padding:"12px",marginBottom:12,border:"1px solid #c5e1a5"}}>
                        <p style={{fontSize:12,color:"#2e7d32",fontWeight:"bold",margin:"0 0 8px 0"}}>📝 今日の単語</p>
                        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
                          <div style={{flex:1}}>
                            <p style={{fontSize:18,color:"#1b5e20",fontWeight:"bold",margin:"0 0 2px 0"}}>{q.vocab_word}</p>
                            <p style={{fontSize:13,color:"#555",margin:0}}>意味：{q.vocab_meaning}</p>
                          </div>
                          <button onClick={()=>handleSpeak(q.vocab_word,`vocab_${q.id}`)}
                            style={{background:speaking===`vocab_${q.id}`?"#c8e6c9":"#e8f5e9",border:"1px solid #81c784",borderRadius:8,padding:"8px 12px",fontSize:13,cursor:"pointer",color:"#2e7d32",fontWeight:"bold"}}>
                            {speaking===`vocab_${q.id}`?"🔊...":"🔊 聞く"}
                          </button>
                        </div>
                        {q.words.map((w,wi)=>(
                          <div key={wi} style={{borderTop:"1px dashed #c5e1a5",paddingTop:8,marginTop:8}}>
                            <div style={{display:"flex",alignItems:"center",gap:8}}>
                              <span style={{fontSize:14,fontWeight:"bold",color:"#33691e"}}>{w.word}</span>
                              <span style={{fontSize:12,color:"#777"}}>({w.meaning})</span>
                              <button onClick={()=>handleSpeak(w.example,`ex_${q.id}_${wi}`)}
                                style={{marginLeft:"auto",background:"#e8f5e9",border:"1px solid #81c784",borderRadius:6,padding:"3px 8px",fontSize:11,cursor:"pointer",color:"#2e7d32"}}>
                                {speaking===`ex_${q.id}_${wi}`?"🔊...":"🔊"}
                              </button>
                            </div>
                            <p style={{fontSize:12,color:"#666",margin:"4px 0 0 0"}}>{w.example}</p>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              );
            })}

            <div style={{background:"linear-gradient(135deg,#7b1fa2,#4a148c)",borderRadius:14,padding:"14px 16px",marginBottom:12}}>
              <h2 style={{color:"white",fontSize:16,fontWeight:"bold",margin:"0 0 2px 0"}}>🧪 単語マッチング</h2>
              <p style={{color:"rgba(255,255,255,0.8)",fontSize:12,margin:0}}>英語 → 日本語の意味をタップして繋げよう！</p>
            </div>

            <div style={{background:"white",borderRadius:14,marginBottom:14,padding:"14px 12px",boxShadow:"0 2px 6px rgba(0,0,0,0.07)",border:"2px solid #e1bee7"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                <p style={{fontSize:14,fontWeight:"bold",color:"#7b1fa2",margin:0}}>📝 単語マッチング</p>
                <span style={{background:"#7b1fa2",color:"white",borderRadius:20,padding:"3px 12px",fontSize:13,fontWeight:"bold"}}>{vocabScore} / {vocabPool.length}</span>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                <div>
                  {vocabPool.map(v=>{
                    const matched=vocabMatched[v.id];
                    const sel=vocabSelected.left===v.id;
                    return <button key={v.id} onClick={()=>handleVocabLeft(v.id)}
                      style={{display:"block",width:"100%",marginBottom:6,padding:"10px 8px",borderRadius:10,fontSize:14,fontWeight:"bold",cursor:matched?"default":"pointer",textAlign:"center",
                        background:matched?"#e8f5e9":sel?"#fff9c4":"#f5f5f5",
                        border:`2px solid ${matched?"#43a047":sel?"#f9a825":"#ddd"}`,
                        color:matched?"#2e7d32":sel?"#f57f17":"#333",opacity:matched?0.7:1}}>
                      {v.en}{matched?" ✓":""}
                    </button>;
                  })}
                </div>
                <div>
                  {shuffledVocabJp.map(v=>{
                    const matched=vocabMatched[`jp_${v.id}`];
                    const sel=vocabSelected.right===v.id;
                    return <button key={v.id} onClick={()=>handleVocabRight(v.id)}
                      style={{display:"block",width:"100%",marginBottom:6,padding:"10px 8px",borderRadius:10,fontSize:14,fontWeight:"bold",cursor:matched?"default":"pointer",textAlign:"center",
                        background:matched?"#e8f5e9":sel?"#fff9c4":"#f5f5f5",
                        border:`2px solid ${matched?"#43a047":sel?"#f9a825":"#ddd"}`,
                        color:matched?"#2e7d32":sel?"#f57f17":"#333",opacity:matched?0.7:1}}>
                      {v.jp}{matched?" ✓":""}
                    </button>;
                  })}
                </div>
              </div>
              {vocabScore===vocabPool.length && <p style={{textAlign:"center",fontSize:15,fontWeight:"bold",color:"#43a047",marginTop:10}}>🎉 全問正解！Perfect!</p>}
            </div>

            {submitError && (
              <div style={{background:"#ffebee",border:"1px solid #e53935",borderRadius:10,padding:"10px 14px",marginBottom:8,fontSize:13,color:"#c62828"}}>
                ⚠️ {submitError}　もう一度試してね。
              </div>
            )}
            <button onClick={handleSubmit} disabled={submitting}
              style={{width:"100%",background:submitting?"#90a4ae":"linear-gradient(135deg,#ff8fb3,#e0729a)",color:"white",border:"none",padding:"18px",borderRadius:16,fontSize:17,cursor:submitting?"default":"pointer",fontWeight:"bold",boxShadow:submitting?"none":"0 4px 14px rgba(224,114,154,0.4)",marginTop:4}}>
              {submitting ? "⏳ 送信中..." : "📬 できた！提出する"}
            </button>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App/>, document.getElementById("root"));
  </script>
</body>
</html>
