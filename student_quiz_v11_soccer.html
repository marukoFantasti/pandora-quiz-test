    function DrawCanvas({ id, height = 80, label = "✏️ 書いてみよう！/ Let's write it!", canvasRef: externalRef }) {
      const internalRef = React.useRef(null);
      const canvasRef = externalRef || internalRef;
      const isDrawing = React.useRef(false);
      const lastPos = React.useRef(null);
      const [hasDrawing, setHasDrawing] = React.useState(false);

      React.useEffect(() => {
        const canvas = canvasRef.current;
        const handleTouchStart = (e) => { e.preventDefault(); isDrawing.current = true; lastPos.current = getPos(e, canvas); setHasDrawing(true); };
        const handleTouchMove = (e) => {
          e.preventDefault();
          if (!isDrawing.current) return;
          const ctx = canvas.getContext("2d");
          const pos = getPos(e, canvas);
          ctx.beginPath(); ctx.moveTo(lastPos.current.x, lastPos.current.y); ctx.lineTo(pos.x, pos.y); ctx.stroke();
          lastPos.current = pos;
        };
        const handleTouchEnd = (e) => { e.preventDefault(); isDrawing.current = false; };
        canvas.addEventListener("touchstart", handleTouchStart, { passive: false });
        canvas.addEventListener("touchmove", handleTouchMove, { passive: false });
        canvas.addEventListener("touchend", handleTouchEnd, { passive: false });
        return () => {
          canvas.removeEventListener("touchstart", handleTouchStart);
          canvas.removeEventListener("touchmove", handleTouchMove);
          canvas.removeEventListener("touchend", handleTouchEnd);
        };
      }, []);

      React.useEffect(() => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#fffde7";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = "#1a237e";
        ctx.lineWidth = 3;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
      }, []);

      const getPos = (e, canvas) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        if (e.touches) return { x: (e.touches[0].clientX - rect.left) * scaleX, y: (e.touches[0].clientY - rect.top) * scaleY };
        return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
      };

      const startDraw = (e) => { e.preventDefault(); isDrawing.current = true; lastPos.current = getPos(e, canvasRef.current); setHasDrawing(true); };
      const draw = (e) => {
        e.preventDefault();
        if (!isDrawing.current) return;
        const canvas = canvasRef.current;
        const ctx = canvas.getContext("2d");
        const pos = getPos(e, canvas);
        ctx.beginPath(); ctx.moveTo(lastPos.current.x, lastPos.current.y); ctx.lineTo(pos.x, pos.y); ctx.stroke();
        lastPos.current = pos;
      };
      const stopDraw = (e) => { e.preventDefault(); isDrawing.current = false; };

      const clear = () => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#fffde7";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        setHasDrawing(false);
      };

      return (
        <div style={{ marginTop: 10 }}>
          <p style={{ fontSize: 12, color: "#5c6bc0", fontWeight: "bold", margin: "0 0 6px 0" }}>{label}</p>
          <canvas ref={canvasRef} width={400} height={height * 5}
            onMouseDown={startDraw} onMouseMove={draw} onMouseUp={stopDraw} onMouseLeave={stopDraw}
            style={{ width: "100%", height: height, border: "2px dashed #9fa8da", borderRadius: 10, background: "#fffde7", display: "block", touchAction: "none", cursor: "crosshair", WebkitUserSelect: "none", userSelect: "none" }}
          />
          {hasDrawing && (
            <button onClick={clear} style={{ marginTop: 6, background: "#f5f5f5", border: "1px solid #ddd", color: "#666", padding: "4px 12px", borderRadius: 8, fontSize: 12, cursor: "pointer" }}>
              🗑️ Clear
            </button>
          )}
        </div>
      );
    }

      const handleSpeak = (id, text, reading) => {
        setSpeaking(prev => ({ ...prev, [id]: true }));
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(reading || text);
        utter.lang = "ja-JP"; utter.rate = 1.0; utter.pitch = 1.0;
        utter.onend = () => setSpeaking(prev => ({ ...prev, [id]: false }));
        window.speechSynthesis.speak(utter);
      };

      const handleKanji = (id, choice, correct) => {
        if (kanjiAnswers[id]) return;
        setKanjiAnswers(prev => ({ ...prev, [id]: choice }));
      };

      // Supabase設定
      const SUPABASE_URL = "https://upmflhdbhbyzoeldrvvw.supabase.co";
      const SUPABASE_KEY = "sb_publishable_K8Y_bNHVA4szRXFM_EcDkA_LBckunu5";

      const [submitting, setSubmitting] = React.useState(false);
      const [submitError, setSubmitError] = React.useState(null);

      const handleSubmit = async () => {
        setSubmitting(true);
        setSubmitError(null);
        try {
          const nameCanvas = nameCanvasRef.current?.toDataURL("image/png") || null;
          const questionData = questions.map(q => ({
            id: q.id,
            category: q.category,
            equation_canvas: eqRefs.current[q.id]?.current?.toDataURL("image/png") || null,
            answer_canvas: ansRefs.current[q.id]?.current?.toDataURL("image/png") || null,
          }));
          const kanjiData = kanjiQuiz.map(k => ({
            id: k.id,
            selected: kanjiAnswers[k.id] || null,
            correct: k.correct,
            canvas: kanjiRefs.current[k.id]?.current?.toDataURL("image/png") || null,
          }));

          const payload = {
            student_name: "（手書き）",
            week: QUIZ_META.week,
            grade: QUIZ_META.grade,
            name_canvas: nameCanvas,
            questions: { math: questionData, kanji: kanjiData },
            grammar_score: null,
            listening_score: null,
            vocab_score: null,
            english_opened_count: null,
            submitted_at: new Date().toISOString(),
          };

          const res = await fetch(`${SUPABASE_URL}/rest/v1/submissions`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "apikey": SUPABASE_KEY,
              "Authorization": `Bearer ${SUPABASE_KEY}`,
              "Prefer": "return=minimal",
            },
            body: JSON.stringify(payload),
          });

          if(!res.ok) throw new Error(`Error: ${res.status}`);
          setSubmitted(true);
          window.scrollTo({ top: 0, behavior: "smooth" });
        } catch(e) {
          setSubmitError(e.message);
        } finally {
          setSubmitting(false);
        }
      };

      // 提出確認画面
      if (submitted) {
        return (
          <div style={{ minHeight: "100vh", background: "#f0f4ff", paddingBottom: 60, width: "100%", overflowX: "hidden" }}>
            <div style={{ background: "linear-gradient(135deg, #1a73e8, #0d47a1)", color: "white", padding: "20px 16px 16px" }}>
              <h1 style={{ fontSize: 18, fontWeight: "bold", margin: "0 0 4px 0" }}>✅ 提出完了！/ Submitted!</h1>
              <p style={{ fontSize: 13, margin: 0, opacity: 0.85 }}>先生に届いたよ！/ Your work has been sent! 🎉</p>
            </div>
            <div style={{ padding: "16px 12px" }}>
              {/* 名前 */}
              <div style={{ background: "white", borderRadius: 14, marginBottom: 12, padding: "14px 12px", boxShadow: "0 2px 6px rgba(0,0,0,0.07)" }}>
                <p style={{ fontSize: 13, fontWeight: "bold", color: "#1a73e8", margin: "0 0 8px 0" }}>✏️ なまえ / Name</p>
                {nameCanvasRef.current && <img src={nameCanvasRef.current.toDataURL()} style={{ width: "100%", borderRadius: 8, border: "1px solid #ddd" }} />}
              </div>
              {/* 算数問題 */}
              {questions.map((q, idx) => (
                <div key={q.id} style={{ background: "white", borderRadius: 14, marginBottom: 12, padding: "14px 12px", boxShadow: "0 2px 6px rgba(0,0,0,0.07)", border: "2px solid #dde3f0" }}>
                  <div style={{ display: "flex", gap: 6, marginBottom: 8 }}>
                    <span style={{ background: "#1a73e8", color: "white", borderRadius: 6, padding: "2px 8px", fontSize: 12, fontWeight: "bold" }}>Q{idx + 1}</span>
                    <span style={{ background: "#e8f0fe", color: "#1a73e8", borderRadius: 6, padding: "2px 8px", fontSize: 11 }}>{q.category}</span>
                  </div>
                  <p style={{ fontSize: 13, color: "#444", margin: "0 0 10px 0", lineHeight: 1.6 }}>{q.jp}</p>
                  <p style={{ fontSize: 11, color: "#888", margin: "0 0 4px 0", fontWeight: "bold" }}>📐 式 / Equation</p>
                  {eqRefs.current[q.id]?.current && <img src={eqRefs.current[q.id].current.toDataURL()} style={{ width: "100%", borderRadius: 8, border: "1px solid #ddd", marginBottom: 8 }} />}
                  <p style={{ fontSize: 11, color: "#888", margin: "0 0 4px 0", fontWeight: "bold" }}>✍️ 答え / Answer</p>
                  {ansRefs.current[q.id]?.current && <img src={ansRefs.current[q.id].current.toDataURL()} style={{ width: "100%", borderRadius: 8, border: "1px solid #ddd" }} />}
                </div>
              ))}
              {/* 漢字 */}
              {kanjiQuiz.map((k) => {
                const selected = kanjiAnswers[k.id];
                const isCorrect = selected === k.correct;
                return (
                  <div key={k.id} style={{ background: "white", borderRadius: 14, marginBottom: 12, padding: "14px 12px", boxShadow: "0 2px 6px rgba(0,0,0,0.07)", border: `2px solid ${selected ? (isCorrect ? "#43a047" : "#e53935") : "#dde3f0"}` }}>
                    <span style={{ background: "#e65100", color: "white", borderRadius: 6, padding: "2px 8px", fontSize: 12, fontWeight: "bold" }}>漢字</span>
                    <p style={{ fontSize: 14, margin: "8px 0 4px 0" }}>{k.en} = {k.hiragana}</p>
                    <p style={{ fontSize: 13, margin: "0 0 8px 0", color: selected ? (isCorrect ? "#43a047" : "#e53935") : "#888", fontWeight: "bold" }}>
                      {selected ? `選んだ答え: ${selected} ${isCorrect ? "✓" : "✗"}` : "（未回答）"}
                    </p>
                    <p style={{ fontSize: 11, color: "#888", margin: "0 0 4px 0", fontWeight: "bold" }}>✍️ 書いてみよう</p>
                    {kanjiRefs.current[k.id]?.current && <img src={kanjiRefs.current[k.id].current.toDataURL()} style={{ width: "100%", borderRadius: 8, border: "1px solid #ddd" }} />}
                  </div>
                );
              })}
              <button onClick={() => setSubmitted(false)}
                style={{ width: "100%", background: "#f5f5f5", border: "2px solid #ddd", color: "#666", padding: "14px", borderRadius: 14, fontSize: 15, cursor: "pointer", fontWeight: "bold" }}>
                ← 戻って直す / Go back
              </button>
            </div>
          </div>
        );
      }

      return (
        <div style={{ minHeight: "100vh", background: "#f0f4ff", paddingBottom: 100, width: "100%", overflowX: "hidden" }}>
          {/* ヘッダー */}
          <div style={{ background: "linear-gradient(135deg, #1a73e8, #0d47a1)", color: "white", padding: "20px 16px 14px", position: "sticky", top: 0, zIndex: 100, boxShadow: "0 2px 10px rgba(0,0,0,0.2)", width: "100%" }}>
            <h1 style={{ fontSize: 18, fontWeight: "bold", margin: "0 0 2px 0" }}>⚽ 算数で日本語を学ぼう！</h1>
            <p style={{ fontSize: 12, margin: "0 0 0 0", opacity: 0.85 }}>Learn Japanese through Math ✨　2026 FIFAワールドカップ編　Week {QUIZ_META.week}</p>
          </div>

          <div style={{ padding: "14px 12px", width: "100%" }}>

            {/* 名前 */}
            <div style={{ background: "white", borderRadius: 14, marginBottom: 16, border: "2px solid #1a73e8", overflow: "hidden", boxShadow: "0 2px 6px rgba(0,0,0,0.07)" }}>
              <div style={{ padding: "14px 12px" }}>
                <p style={{ fontSize: 14, fontWeight: "bold", color: "#1a73e8", margin: "0 0 8px 0" }}>✏️ Your name / なまえ</p>
                <DrawCanvas id="name" height={80} label="Write your name here! なまえをかいてね！" canvasRef={nameCanvasRef} />
              </div>
            </div>

            {/* 算数問題 */}
            {questions.map((q, idx) => (
              <div key={q.id} style={{ background: "white", borderRadius: 14, marginBottom: 16, border: "2px solid #dde3f0", overflow: "hidden", boxShadow: "0 2px 6px rgba(0,0,0,0.07)", width: "100%" }}>
                <div style={{ padding: "14px 12px 12px" }}>
                  <div style={{ display: "flex", gap: 6, marginBottom: 10, flexWrap: "wrap" }}>
                    <span style={{ background: "#1a73e8", color: "white", borderRadius: 6, padding: "2px 8px", fontSize: 12, fontWeight: "bold" }}>Q{idx + 1}</span>
                    <span style={{ background: "#e8f0fe", color: "#1a73e8", borderRadius: 6, padding: "2px 8px", fontSize: 11 }}>{q.category}</span>
                  </div>
                  <div style={{ display: "flex", gap: 12, alignItems: "center", marginBottom: 12 }}>
                    <div style={{ flexShrink: 0 }}>{illustrations[q.id]}</div>
                    <p style={{ fontSize: 15, lineHeight: 1.8, color: "#222", margin: 0, fontWeight: "500", wordBreak: "break-word" }}>{q.jp}</p>
                  </div>
                  <button onClick={() => handleSpeak(q.id, q.jp, q.reading)}
                    style={{ background: speaking[q.id] ? "#e3f2fd" : "#f5f5f5", border: `1px solid ${speaking[q.id] ? "#1a73e8" : "#ddd"}`, color: speaking[q.id] ? "#1a73e8" : "#666", padding: "5px 14px", borderRadius: 8, fontSize: 13, cursor: "pointer", marginBottom: 14 }}>
                    {speaking[q.id] ? "🔊 Playing..." : "🔊 Hear it!"}
                  </button>

                  {/* 式エリア */}
                  <DrawCanvas id={`eq_${q.id}`} height={150} label="📐 式を書こう！/ Write your equation!" canvasRef={eqRefs.current[q.id]} />

                  {/* 答えエリア */}
                  <div style={{ marginTop: 12 }}>
                    <DrawCanvas id={`ans_${q.id}`} height={120} label={`✍️ 答えを書こう！/ Write your answer!（単位: ${q.unit}）`} canvasRef={ansRefs.current[q.id]} />
                  </div>

                  {/* ことば・英語ヒント */}
                  <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 14 }}>
                    <button onClick={() => setShowWords(prev => ({ ...prev, [q.id]: !prev[q.id] }))}
                      style={{ background: showWords[q.id] ? "#fff3e0" : "#f5f5f5", border: `1px solid ${showWords[q.id] ? "#ff9800" : "#ddd"}`, color: showWords[q.id] ? "#e65100" : "#666", padding: "6px 12px", borderRadius: 8, fontSize: 12, cursor: "pointer" }}>
                      📖 ことば / Words
                    </button>
                    <button onClick={() => setShowHint(prev => ({ ...prev, [q.id]: !prev[q.id] }))}
                      style={{ background: showHint[q.id] ? "#e8f5e9" : "#f5f5f5", border: `1px solid ${showHint[q.id] ? "#43a047" : "#ddd"}`, color: showHint[q.id] ? "#2e7d32" : "#666", padding: "6px 12px", borderRadius: 8, fontSize: 12, cursor: "pointer" }}>
                      🇬🇧 English hint
                    </button>
                  </div>
                </div>
                {showWords[q.id] && (
                  <div style={{ borderTop: "1px solid #fff3e0", background: "#fffbf0", padding: "12px" }}>
                    <p style={{ fontSize: 12, color: "#e65100", fontWeight: "bold", margin: "0 0 8px 0" }}>📖 ことばの説明 / Word Guide</p>
                    {q.words.map((w, i) => (
                      <div key={i} style={{ background: "white", border: "1px solid #ffe0b2", borderRadius: 10, padding: "8px 10px", marginBottom: 6 }}>
                        <p style={{ margin: "0 0 2px 0", fontSize: 14, fontWeight: "bold", color: "#333" }}>{w.word}</p>
                        <p style={{ margin: "0 0 2px 0", fontSize: 13, color: "#1a73e8" }}>🇬🇧 {w.meaning}</p>
                        <p style={{ margin: 0, fontSize: 12, color: "#888" }}>例: {w.example}</p>
                      </div>
                    ))}
                  </div>
                )}
                {showHint[q.id] && (
                  <div style={{ borderTop: "1px solid #e8f5e9", background: "#f1f8f1", padding: "12px" }}>
                    <p style={{ fontSize: 12, color: "#2e7d32", fontWeight: "bold", margin: "0 0 6px 0" }}>🇬🇧 English Translation</p>
                    <p style={{ fontSize: 14, color: "#333", margin: 0, lineHeight: 1.7, fontStyle: "italic" }}>{q.en}</p>
                  </div>
                )}
              </div>
            ))}

            {/* 漢字クイズ */}
            <div style={{ background: "linear-gradient(135deg, #e65100, #bf360c)", borderRadius: 14, padding: "14px 16px", marginBottom: 12 }}>
              <h2 style={{ color: "white", fontSize: 16, fontWeight: "bold", margin: "0 0 2px 0" }}>🈳 今日の漢字 / Today's Kanji ⚽</h2>
              <p style={{ color: "rgba(255,255,255,0.8)", fontSize: 12, margin: 0 }}>足・球・得点　選んで、書いてみよう！</p>
            </div>

            {kanjiQuiz.map((k) => {
              const selected = kanjiAnswers[k.id];
              const isCorrect = selected === k.correct;
              return (
                <div key={k.id} style={{ background: "white", borderRadius: 14, marginBottom: 16, border: `2px solid ${selected ? (isCorrect ? "#43a047" : "#e53935") : "#dde3f0"}`, overflow: "hidden", boxShadow: "0 2px 6px rgba(0,0,0,0.07)", width: "100%" }}>
                  <div style={{ padding: "14px 12px" }}>
                    <div style={{ display: "flex", gap: 6, marginBottom: 10 }}>
                      <span style={{ background: "#e65100", color: "white", borderRadius: 6, padding: "2px 8px", fontSize: 12, fontWeight: "bold" }}>漢字</span>
                    </div>
                    <div style={{ display: "flex", gap: 12, alignItems: "center", marginBottom: 10 }}>
                      <div style={{ flexShrink: 0 }}>{kanjiIllustrations[k.id]}</div>
                      <div>
                        <p style={{ fontSize: 18, fontWeight: "bold", color: "#222", margin: "0 0 4px 0" }}>{k.en} = {k.hiragana}</p>
                        <p style={{ fontSize: 13, color: "#888", margin: 0, fontStyle: "italic" }}>{k.hint}</p>
                      </div>
                    </div>
                    <p style={{ fontSize: 13, color: "#555", margin: "0 0 10px 0" }}>漢字はどれ？ / Which kanji?</p>
                    <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 10 }}>
                      {k.choices.map((choice) => {
                        let bg = "#f5f5f5", border = "#ddd", color = "#333";
                        if (selected) {
                          if (choice === k.correct) { bg = "#e8f5e9"; border = "#43a047"; color = "#2e7d32"; }
                          else if (choice === selected && choice !== k.correct) { bg = "#ffebee"; border = "#e53935"; color = "#c62828"; }
                        }
                        return (
                          <button key={choice} onClick={() => handleKanji(k.id, choice, k.correct)}
                            style={{ background: bg, border: `2px solid ${border}`, color, padding: "12px 20px", borderRadius: 10, fontSize: 24, cursor: selected ? "default" : "pointer", fontWeight: "bold", minWidth: 70 }}>
                            {choice}
                          </button>
                        );
                      })}
                    </div>
                    {selected && (
                      <p style={{ fontSize: 14, fontWeight: "bold", color: isCorrect ? "#43a047" : "#e53935", marginBottom: 10 }}>
                        {isCorrect ? "✓ 正解！Correct! 🎉" : `✗ 正解は「${k.correct}」/ The answer is「${k.correct}」`}
                      </p>
                    )}
                    <DrawCanvas id={k.id} height={160} label="✍️ 書いてみよう！/ Let's write it!" canvasRef={kanjiRefs.current[k.id]} />
                  </div>
                </div>
              );
            })}

            {/* エラー表示 */}
            {submitError && (
              <div style={{ background: "#ffebee", border: "1px solid #e53935", borderRadius: 10, padding: "10px 14px", marginBottom: 8, fontSize: 13, color: "#c62828" }}>
                ⚠️ {submitError}　Please try again.
              </div>
            )}
            {/* 提出ボタン */}
            <button onClick={handleSubmit} disabled={submitting}
              style={{ width: "100%", background: submitting ? "#90a4ae" : "linear-gradient(135deg, #1a73e8, #0d47a1)", color: "white", border: "none", padding: "18px", borderRadius: 16, fontSize: 17, cursor: submitting ? "default" : "pointer", fontWeight: "bold", boxShadow: submitting ? "none" : "0 4px 14px rgba(26,115,232,0.4)", marginTop: 8, transition: "all 0.2s" }}>
              {submitting ? "⏳ Submitting..." : "📬 できた！提出する / Submit!"}
            </button>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
