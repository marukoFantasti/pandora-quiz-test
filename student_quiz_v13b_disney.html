    // ─── DrawCanvas ───────────────────────────────────────────
    function DrawCanvas({ id, height=120, label="✏️ ここに書こう", canvasRef: externalRef }) {
      const internalRef = React.useRef(null);
      const canvasRef = externalRef || internalRef;
      const isDrawing = React.useRef(false);
      const lastPos = React.useRef(null);

      const getPos = (e, canvas) => {
        const rect = canvas.getBoundingClientRect();
        const sx = canvas.width/rect.width, sy = canvas.height/rect.height;
        if(e.touches) return {x:(e.touches[0].clientX-rect.left)*sx, y:(e.touches[0].clientY-rect.top)*sy};
        return {x:(e.clientX-rect.left)*sx, y:(e.clientY-rect.top)*sy};
      };

      React.useEffect(() => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle="#fffde7"; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.strokeStyle="#1a237e"; ctx.lineWidth=3; ctx.lineCap="round"; ctx.lineJoin="round";
        const onTS=(e)=>{e.preventDefault();isDrawing.current=true;lastPos.current=getPos(e,canvas);};
        const onTM=(e)=>{e.preventDefault();if(!isDrawing.current)return;const pos=getPos(e,canvas);const c2=canvas.getContext("2d");c2.beginPath();c2.moveTo(lastPos.current.x,lastPos.current.y);c2.lineTo(pos.x,pos.y);c2.stroke();lastPos.current=pos;};
        const onTE=(e)=>{e.preventDefault();isDrawing.current=false;};
        canvas.addEventListener("touchstart",onTS,{passive:false});
        canvas.addEventListener("touchmove",onTM,{passive:false});
        canvas.addEventListener("touchend",onTE,{passive:false});
        return()=>{canvas.removeEventListener("touchstart",onTS);canvas.removeEventListener("touchmove",onTM);canvas.removeEventListener("touchend",onTE);};
      },[]);

      const sd=(e)=>{isDrawing.current=true;lastPos.current=getPos(e,canvasRef.current);};
      const dr=(e)=>{if(!isDrawing.current)return;const c=canvasRef.current;const ctx=c.getContext("2d");const pos=getPos(e,c);ctx.beginPath();ctx.moveTo(lastPos.current.x,lastPos.current.y);ctx.lineTo(pos.x,pos.y);ctx.stroke();lastPos.current=pos;};
      const sp=()=>{isDrawing.current=false;};
      const clear=()=>{const c=canvasRef.current;const ctx=c.getContext("2d");ctx.fillStyle="#fffde7";ctx.fillRect(0,0,c.width,c.height);ctx.strokeStyle="#1a237e";ctx.lineWidth=3;ctx.lineCap="round";ctx.lineJoin="round";};

      return (
        <div style={{marginBottom:8}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
            <span style={{fontSize:12,color:"#666",fontWeight:"bold"}}>{label}</span>
            <button onClick={clear} style={{fontSize:11,color:"#999",background:"none",border:"1px solid #ddd",borderRadius:6,padding:"2px 8px",cursor:"pointer"}}>消す</button>
          </div>
          <canvas ref={canvasRef} width={600} height={height}
            style={{width:"100%",height:height,borderRadius:10,border:"2px solid #c5cae9",display:"block",touchAction:"none",cursor:"crosshair"}}
            onMouseDown={sd} onMouseMove={dr} onMouseUp={sp} onMouseLeave={sp}/>
        </div>
      );
    }

    // ─── 並び替えコンポーネント ───────────────────────────────
    function SortTest({ sentence, onDone }) {
      const words = React.useMemo(() => sentence.split(" ").sort(()=>Math.random()-0.5), [sentence]);
      const [selected, setSelected] = React.useState([]);
      const [remaining, setRemaining] = React.useState(words);
      const [result, setResult] = React.useState(null);

      const addWord = (w, idx) => {
        if(result) return;
        setSelected(s=>[...s,w]);
        setRemaining(r=>r.filter((_,i)=>i!==idx));
      };
      const removeWord = (w, idx) => {
        if(result) return;
        setRemaining(r=>[...r,w]);
        setSelected(s=>s.filter((_,i)=>i!==idx));
      };
      const check = () => {
        const ans = selected.join(" ");
        const correct = ans === sentence;
        setResult(correct);
        if(correct && onDone) onDone();
      };
      const reset = () => { setSelected([]); setRemaining(words); setResult(null); };

      return (
        <div>
          {/* 並べる場所 */}
          <div style={{minHeight:48,background:"#f9fbe7",border:"2px dashed #aed581",borderRadius:10,padding:"8px",marginBottom:8,display:"flex",flexWrap:"wrap",gap:6,alignItems:"center"}}>
            {selected.length===0 && <span style={{color:"#aaa",fontSize:13}}>ここに並べよう</span>}
            {selected.map((w,i)=>(
              <button key={i} onClick={()=>removeWord(w,i)}
                style={{background:"#c8e6c9",border:"2px solid #66bb6a",borderRadius:8,padding:"6px 12px",fontSize:14,fontWeight:"bold",cursor:"pointer",color:"#1b5e20"}}>
                {w}
              </button>
            ))}
          </div>
          {/* 単語パレット */}
          <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:10}}>
            {remaining.map((w,i)=>(
              <button key={i} onClick={()=>addWord(w,i)}
                style={{background:"white",border:"2px solid #1a73e8",borderRadius:8,padding:"6px 12px",fontSize:14,fontWeight:"bold",cursor:"pointer",color:"#1a73e8"}}>
                {w}
              </button>
            ))}
          </div>
          {/* 判定・リセット */}
          <div style={{display:"flex",gap:8}}>
            {result===null && selected.length>0 &&
              <button onClick={check} style={{background:"#1a73e8",color:"white",border:"none",padding:"8px 20px",borderRadius:10,fontSize:14,fontWeight:"bold",cursor:"pointer"}}>確認する</button>}
            {result!==null &&
              <p style={{fontSize:14,fontWeight:"bold",color:result?"#43a047":"#e53935",padding:"8px 0"}}>
                {result ? "✓ 正解！ 🎉" : `✗ もう一度！　正解：${sentence}`}
              </p>}
            {result===false && <button onClick={reset} style={{background:"#ff7043",color:"white",border:"none",padding:"8px 16px",borderRadius:10,fontSize:13,fontWeight:"bold",cursor:"pointer"}}>リセット</button>}
          </div>
        </div>
      );
    }

    // ─── メインApp ────────────────────────────────────────────
    function App() {
      const [englishOpen, setEnglishOpen] = React.useState({});
      const [sortTestOpen, setSortTestOpen] = React.useState({});
      const [sortDone, setSortDone] = React.useState({});
      const [grammarAnswers, setGrammarAnswers] = React.useState({});
      const [listeningAnswers, setListeningAnswers] = React.useState({});
      const [vocabSelected, setVocabSelected] = React.useState({left:null,right:null});
      const [vocabMatched, setVocabMatched] = React.useState({});
      const [submitted, setSubmitted] = React.useState(false);
      const [speaking, setSpeaking] = React.useState(null);

      const nameCanvasRef = React.useRef(null);
      const eqRefs = React.useRef({});
      const ansRefs = React.useRef({});
      questions.forEach(q=>{
        if(!eqRefs.current[q.id]) eqRefs.current[q.id]=React.createRef();
        if(!ansRefs.current[q.id]) ansRefs.current[q.id]=React.createRef();
      });

      const shuffledVocabJp = React.useMemo(()=>[...vocabPool].sort(()=>Math.random()-0.5),[]);

      // 音声
      const handleSpeak = (text, id) => {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang="en-US"; u.rate=0.85;
        setSpeaking(id);
        u.onend=()=>setSpeaking(null);
        window.speechSynthesis.speak(u);
      };

      // ＋English開閉
      const toggleEnglish = (id) => setEnglishOpen(p=>({...p,[id]:!p[id]}));

      // 並び替えテスト
      const toggleSort = (id) => setSortTestOpen(p=>({...p,[id]:!p[id]}));

      // 文法
      const handleGrammar = (id, choice) => { if(!grammarAnswers[id]) setGrammarAnswers(p=>({...p,[id]:choice})); };

      // ヒアリング
      const handleListening = (id, choice) => { if(!listeningAnswers[id]) setListeningAnswers(p=>({...p,[id]:choice})); };

      // 単語マッチング
      const handleVocabLeft = (id) => {
        if(vocabMatched[id]) return;
        setVocabSelected(prev=>{
          const newLeft = prev.left===id ? null : id;
          if(newLeft && prev.right){
            const correctJp = vocabPool.find(v=>v.id===newLeft)?.jp;
            const selectedJp = shuffledVocabJp.find(v=>v.id===prev.right)?.jp;
            if(correctJp===selectedJp){
              setVocabMatched(m=>({...m,[newLeft]:true,[`jp_${prev.right}`]:true}));
              return {left:null,right:null};
            }
            return {left:newLeft,right:prev.right};
          }
          return {...prev,left:newLeft};
        });
      };
      const handleVocabRight = (id) => {
        if(vocabMatched[`jp_${id}`]) return;
        setVocabSelected(prev=>{
          const newRight = prev.right===id ? null : id;
          if(prev.left && newRight){
            const correctJp = vocabPool.find(v=>v.id===prev.left)?.jp;
            const selectedJp = shuffledVocabJp.find(v=>v.id===newRight)?.jp;
            if(correctJp===selectedJp){
              setVocabMatched(m=>({...m,[prev.left]:true,[`jp_${newRight}`]:true}));
              return {left:null,right:null};
            }
            return {left:prev.left,right:newRight};
          }
          return {...prev,right:newRight};
        });
      };
      const vocabScore = Object.keys(vocabMatched).filter(k=>!k.startsWith("jp_")).length;

      // Supabase設定
      const SUPABASE_URL = "https://upmflhdbhbyzoeldrvvw.supabase.co";
      const SUPABASE_KEY = "sb_publishable_K8Y_bNHVA4szRXFM_EcDkA_LBckunu5";

      // 提出
      const [submitting, setSubmitting] = React.useState(false);
      const [submitError, setSubmitError] = React.useState(null);

      const handleSubmit = async () => {
        setSubmitting(true);
        setSubmitError(null);
        try {
          const gScore = Object.entries(grammarAnswers).filter(([id,a])=>grammarQuiz.find(g=>g.id===id)?.correct===a).length;
          const lScore = Object.entries(listeningAnswers).filter(([id,a])=>listeningQuiz.find(l=>l.id===id)?.correct===a).length;

          // Canvas画像を取得
          const nameCanvas = nameCanvasRef.current?.toDataURL("image/png") || null;
          const questionData = questions.map(q => ({
            id: q.id,
            math_tag: q.math_tag,
            equation_canvas: eqRefs.current[q.id]?.current?.toDataURL("image/png") || null,
            answer_canvas: ansRefs.current[q.id]?.current?.toDataURL("image/png") || null,
            english_opened: !!englishOpen[q.id],
          }));

          const payload = {
            student_name: "（手書き）",
            week: QUIZ_META.week,
            grade: QUIZ_META.grade,
            name_canvas: nameCanvas,
            questions: questionData,
            grammar_score: gScore,
            listening_score: lScore,
            vocab_score: vocabScore,
            english_opened_count: Object.values(englishOpen).filter(Boolean).length,
            submitted_at: new Date().toISOString(),
          };

          const res = await fetch(`${SUPABASE_URL}/rest/v1/submissions`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "apikey": SUPABASE_KEY,
              "Authorization": `Bearer ${SUPABASE_KEY}`,
              "Prefer": "return=minimal",
            },
            body: JSON.stringify(payload),
          });

          if(!res.ok) throw new Error(`送信エラー: ${res.status}`);
          setSubmitted(true);
          window.scrollTo({top:0,behavior:"smooth"});
        } catch(e) {
          setSubmitError(e.message);
        } finally {
          setSubmitting(false);
        }
      };

      // ─── 提出済み画面 ─────────────────────────────────────
      if(submitted){
        const gScore = Object.entries(grammarAnswers).filter(([id,a])=>grammarQuiz.find(g=>g.id===id)?.correct===a).length;
        const lScore = Object.entries(listeningAnswers).filter(([id,a])=>listeningQuiz.find(l=>l.id===id)?.correct===a).length;
        return (
          <div style={{minHeight:"100vh",background:"#f0f4ff",paddingBottom:60}}>
            <div style={{background:"linear-gradient(135deg,#1a73e8,#0d47a1)",color:"white",padding:"20px 16px 16px"}}>
              <h1 style={{fontSize:18,fontWeight:"bold",margin:"0 0 4px 0"}}>✅ 提出完了！</h1>
              <p style={{fontSize:12,margin:0,opacity:0.85}}>先生に届いたよ！お疲れさま 🎉</p>
            </div>
            <div style={{padding:"14px 12px"}}>
              <div style={{background:"white",borderRadius:14,marginBottom:12,padding:"14px 12px",boxShadow:"0 2px 6px rgba(0,0,0,0.07)"}}>
                <p style={{fontSize:14,fontWeight:"bold",color:"#1a73e8",marginBottom:8}}>📊 英語の結果</p>
                <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                  <span style={{background:"#e8f5e9",color:"#2e7d32",padding:"4px 12px",borderRadius:20,fontSize:13,fontWeight:"bold"}}>文法 {gScore}/3</span>
                  <span style={{background:"#e3f2fd",color:"#1565c0",padding:"4px 12px",borderRadius:20,fontSize:13,fontWeight:"bold"}}>ヒアリング {lScore}/3</span>
                  <span style={{background:"#fff3e0",color:"#e65100",padding:"4px 12px",borderRadius:20,fontSize:13,fontWeight:"bold"}}>単語 {vocabScore}/5</span>
                  <span style={{background:"#f3e5f5",color:"#7b1fa2",padding:"4px 12px",borderRadius:20,fontSize:13,fontWeight:"bold"}}>＋English {Object.values(englishOpen).filter(Boolean).length}/10</span>
                </div>
              </div>
              <div style={{background:"white",borderRadius:14,marginBottom:12,padding:"12px",boxShadow:"0 2px 6px rgba(0,0,0,0.07)"}}>
                <p style={{fontSize:13,fontWeight:"bold",color:"#1a73e8",marginBottom:8}}>なまえ</p>
                {nameCanvasRef.current && <img src={nameCanvasRef.current.toDataURL()} style={{width:"100%",borderRadius:8,border:"1px solid #ddd"}}/>}
              </div>
              {questions.map((q,idx)=>(
                <div key={q.id} style={{background:"white",borderRadius:14,marginBottom:10,padding:"12px",boxShadow:"0 2px 6px rgba(0,0,0,0.07)",border:"2px solid #dde3f0"}}>
                  <div style={{display:"flex",gap:6,marginBottom:6,flexWrap:"wrap"}}>
                    <span style={{background:"#1a73e8",color:"white",borderRadius:6,padding:"2px 8px",fontSize:12,fontWeight:"bold"}}>Q{idx+1}</span>
                    <span style={{background:"#fce4ec",color:"#c62828",borderRadius:6,padding:"2px 8px",fontSize:11,fontWeight:"bold"}}>{q.math_tag}</span>
                    {englishOpen[q.id] && <span style={{background:"#e8f5e9",color:"#2e7d32",borderRadius:6,padding:"2px 8px",fontSize:11}}>＋English ✓</span>}
                    {sortDone[q.id] && <span style={{background:"#fff9c4",color:"#f57f17",borderRadius:6,padding:"2px 8px",fontSize:11}}>並び替え ✓</span>}
                  </div>
                  <p style={{fontSize:13,color:"#444",margin:"0 0 8px 0"}}>{q.jp}</p>
                  <p style={{fontSize:11,color:"#888",margin:"0 0 3px 0",fontWeight:"bold"}}>📐 式</p>
                  {eqRefs.current[q.id]?.current && <img src={eqRefs.current[q.id].current.toDataURL()} style={{width:"100%",borderRadius:8,border:"1px solid #ddd",marginBottom:6}}/>}
                  <p style={{fontSize:11,color:"#888",margin:"0 0 3px 0",fontWeight:"bold"}}>✍️ 答え（{q.unit}）</p>
                  {ansRefs.current[q.id]?.current && <img src={ansRefs.current[q.id].current.toDataURL()} style={{width:"100%",borderRadius:8,border:"1px solid #ddd"}}/>}
                </div>
              ))}
              <button onClick={()=>setSubmitted(false)} style={{width:"100%",background:"#f5f5f5",border:"2px solid #ddd",color:"#666",padding:"14px",borderRadius:14,fontSize:15,cursor:"pointer",fontWeight:"bold"}}>← 戻って直す</button>
            </div>
          </div>
        );
      }

      // ─── メイン画面 ──────────────────────────────────────
      return (
        <div style={{minHeight:"100vh",background:"#f0f4ff",paddingBottom:100,overflowX:"hidden"}}>
          <div style={{background:"linear-gradient(135deg,#1a73e8,#0d47a1)",color:"white",padding:"16px 16px 12px",position:"sticky",top:0,zIndex:100,boxShadow:"0 2px 10px rgba(0,0,0,0.2)"}}>
            <h1 style={{fontSize:17,fontWeight:"bold",margin:"0 0 4px 0"}}>🏰 算数×英語を学ぼう！</h1>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              <span style={{background:"rgba(255,255,255,0.2)",borderRadius:6,padding:"2px 8px",fontSize:11}}>🔢 算数：{QUIZ_META.math_theme}</span>
              <span style={{background:"rgba(255,255,255,0.2)",borderRadius:6,padding:"2px 8px",fontSize:11}}>🌍 英語：{QUIZ_META.english_theme}</span>
              <span style={{background:"rgba(255,255,255,0.15)",borderRadius:6,padding:"2px 8px",fontSize:11}}>Week {QUIZ_META.week}</span>
            </div>
          </div>

          <div style={{padding:"12px 12px"}}>

            {/* 名前 */}
            <div style={{background:"white",borderRadius:14,marginBottom:14,border:"2px solid #1a73e8",overflow:"hidden",boxShadow:"0 2px 6px rgba(0,0,0,0.07)"}}>
              <div style={{padding:"12px"}}>
                <p style={{fontSize:14,fontWeight:"bold",color:"#1a73e8",marginBottom:8}}>✏️ 名前</p>
                <DrawCanvas id="name" height={70} label="名前を書いてね（漢字で）" canvasRef={nameCanvasRef}/>
              </div>
            </div>

            {/* ─── 問題ループ ─── */}
            {questions.map((q,idx)=>{
              const isOpen = englishOpen[q.id];
              const showStructure = !q.english_same_as;
              const isSortOpen = sortTestOpen[q.id];
              return (
                <div key={q.id} style={{background:"white",borderRadius:14,marginBottom:14,border:"2px solid #dde3f0",overflow:"hidden",boxShadow:"0 2px 6px rgba(0,0,0,0.07)"}}>
                  <div style={{padding:"12px"}}>
                    {/* ヘッダー */}
                    <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap",alignItems:"center"}}>
                      <span style={{background:"#1a73e8",color:"white",borderRadius:6,padding:"2px 8px",fontSize:12,fontWeight:"bold"}}>Q{idx+1}</span>
                      <span style={{background:"#e8f0fe",color:"#1a73e8",borderRadius:6,padding:"2px 8px",fontSize:11}}>{q.category}</span>
                      <span style={{background:"#fce4ec",color:"#c62828",borderRadius:6,padding:"2px 8px",fontSize:11,fontWeight:"bold"}}>{q.math_tag}</span>
                    </div>
                    {/* 問題文 */}
                    <div style={{display:"flex",gap:10,alignItems:"flex-start",marginBottom:12}}>
                      <div style={{flexShrink:0}}>{illustrations[q.id]}</div>
                      <p style={{fontSize:16,lineHeight:1.8,color:"#222",margin:0,fontWeight:"500",wordBreak:"break-word"}}>{q.jp}</p>
                    </div>
                    {/* 手書き */}
                    <DrawCanvas id={`eq_${q.id}`} height={150} label="📐 式" canvasRef={eqRefs.current[q.id]}/>
                    <DrawCanvas id={`ans_${q.id}`} height={120} label={`✍️ 答え（${q.unit}）`} canvasRef={ansRefs.current[q.id]}/>
                    {/* ＋Englishボタン */}
                    <button onClick={()=>toggleEnglish(q.id)}
                      style={{width:"100%",marginTop:10,padding:"13px 0",borderRadius:12,border:"none",cursor:"pointer",fontWeight:"bold",fontSize:15,
                        background:isOpen?"linear-gradient(135deg,#2e7d32,#1b5e20)":"linear-gradient(135deg,#43a047,#2e7d32)",
                        color:"white",boxShadow:isOpen?"none":"0 3px 10px rgba(67,160,71,0.5)",transition:"all 0.2s"}}>
                      {isOpen ? "▲ ＋English を閉じる" : "🌍 ＋English　英語もやってみよう！"}
                    </button>
                  </div>

                  {/* ＋Englishパネル */}
                  {isOpen && (
                    <div style={{borderTop:"3px solid #43a047",background:"#f1f8e9",padding:"14px 12px"}}>

                      {/* 文法 */}
                      {showStructure ? (
                        <div style={{background:"white",borderRadius:10,padding:"12px",marginBottom:12,border:"1px solid #c5e1a5"}}>
                          <p style={{fontSize:12,color:"#2e7d32",fontWeight:"bold",margin:"0 0 6px 0"}}>📐 文法</p>
                          <p style={{fontSize:18,color:"#1b5e20",fontWeight:"bold",margin:"0 0 4px 0",fontFamily:"monospace"}}>{q.english_structure}</p>
                          <p style={{fontSize:14,color:"#558b2f",margin:0}}>→ {q.english_answer}</p>
                        </div>
                      ) : (
                        <div style={{background:"#e8f5e9",borderRadius:10,padding:"8px 12px",marginBottom:12,border:"1px dashed #a5d6a7"}}>
                          <p style={{fontSize:12,color:"#558b2f",margin:0}}>💡 文法は同じ：<strong>{q.english_structure}</strong></p>
                        </div>
                      )}

                      {/* 例文 + テストボタン */}
                      <div style={{background:"white",borderRadius:10,padding:"12px",marginBottom:12,border:"1px solid #c5e1a5"}}>
                        <p style={{fontSize:12,color:"#2e7d32",fontWeight:"bold",margin:"0 0 8px 0"}}>💬 この問題を英語で言うと</p>
                        <p style={{fontSize:14,color:"#555",margin:"0 0 8px 0"}}>🇯🇵 {q.example_jp}</p>

                        {!isSortOpen ? (
                          <div>
                            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
                              <p style={{fontSize:15,color:"#1b5e20",fontWeight:"bold",margin:0,fontStyle:"italic",flex:1}}>🇬🇧 {q.example_en}</p>
                              <button onClick={()=>handleSpeak(q.example_en,`ex_${q.id}`)}
                                style={{flexShrink:0,background:speaking===`ex_${q.id}`?"#c8e6c9":"#e8f5e9",border:"1px solid #81c784",borderRadius:8,padding:"5px 10px",fontSize:12,cursor:"pointer",color:"#2e7d32",fontWeight:"bold"}}>
                                {speaking===`ex_${q.id}`?"🔊...":"🔊 聞く"}
                              </button>
                            </div>
                            <button onClick={()=>toggleSort(q.id)}
                              style={{width:"100%",background:"linear-gradient(135deg,#f57f17,#e65100)",color:"white",border:"none",padding:"10px",borderRadius:10,fontSize:14,fontWeight:"bold",cursor:"pointer",boxShadow:"0 2px 8px rgba(245,127,23,0.4)"}}>
                              🧩 並び替えテストに挑戦！
                            </button>
                          </div>
                        ) : (
                          <div>
                            <div style={{background:"#fff9c4",borderRadius:8,padding:"8px 10px",marginBottom:10,fontSize:12,color:"#f57f17",fontWeight:"bold"}}>
                              🧩 英文を正しい順番に並べよう！
                            </div>
                            <SortTest sentence={q.example_en} onDone={()=>setSortDone(p=>({...p,[q.id]:true}))}/>
                            <button onClick={()=>toggleSort(q.id)} style={{marginTop:8,fontSize:12,color:"#888",background:"none",border:"1px solid #ddd",borderRadius:6,padding:"4px 10px",cursor:"pointer"}}>← 例文に戻る</button>
                          </div>
                        )}
                      </div>

                      {/* 単語 */}
                      <div style={{background:"white",borderRadius:10,padding:"12px",border:"1px solid #c5e1a5"}}>
                        <p style={{fontSize:12,color:"#2e7d32",fontWeight:"bold",margin:"0 0 8px 0"}}>📝 今日の単語</p>
                        <div style={{display:"flex",alignItems:"center",gap:10}}>

                          </div>
                          <button onClick={()=>handleSpeak(q.vocab.word,`vocab_${q.id}`)}

                            {speaking===`vocab_${q.id}`?"🔊...":"🔊 聞く"}
                          </button>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              );
            })}

            {/* ─── テストコーナー ─── */}
            <div style={{background:"linear-gradient(135deg,#7b1fa2,#4a148c)",borderRadius:14,padding:"14px 16px",marginBottom:12}}>

              <p style={{color:"rgba(255,255,255,0.8)",fontSize:12,margin:0}}>文法・ヒアリング・単語を確認しよう！</p>
            </div>

            {/* ヒアリング */}
            <div style={{background:"white",borderRadius:14,marginBottom:14,padding:"14px 12px",boxShadow:"0 2px 6px rgba(0,0,0,0.07)",border:"2px solid #e1bee7"}}>

                return (
                  <div key={l.id} style={{marginBottom:16,paddingBottom:16,borderBottom:i<listeningQuiz.length-1?"1px solid #f3e5f5":"none"}}>

                      <button onClick={()=>handleSpeak(l.audio,`listen_${l.id}`)}

                        let bg="#f5f5f5",border="#ddd",color="#333";
                        if(selected){ if(c===l.correct){bg="#e8f5e9";border="#43a047";color="#2e7d32";}
                          else if(c===selected){bg="#ffebee";border="#e53935";color="#c62828";} }
                        return (
                          <button key={ci} onClick={()=>handleListening(l.id,c)}
                            style={{background:bg,border:`2px solid ${border}`,color,padding:"10px 14px",borderRadius:10,fontSize:13,cursor:selected?"default":"pointer",fontWeight:"500",textAlign:"left"}}>
                            {ci+1}. {c}
                          </button>
                        );
                      })}
                    </div>
                    {selected && <p style={{fontSize:13,fontWeight:"bold",color:isCorrect?"#43a047":"#e53935",marginTop:6}}>{isCorrect?"✓ 正解！":"✗ 正解："+l.correct}</p>}
                  </div>
                );
              })}
            </div>

            {/* 文法 */}
            <div style={{background:"white",borderRadius:14,marginBottom:14,padding:"14px 12px",boxShadow:"0 2px 6px rgba(0,0,0,0.07)",border:"2px solid #e1bee7"}}>
              <p style={{fontSize:14,fontWeight:"bold",color:"#7b1fa2",marginBottom:12}}>📐 文法問題　（　）に入る単語は？</p>
              {grammarQuiz.map((g,i)=>{
                const selected = grammarAnswers[g.id];
                const isCorrect = selected===g.correct;
                return (
                  <div key={g.id} style={{marginBottom:14,paddingBottom:14,borderBottom:i<grammarQuiz.length-1?"1px solid #f3e5f5":"none"}}>
                    <p style={{fontSize:15,color:"#333",margin:"0 0 2px 0",fontWeight:"500"}}>Q{i+1}. {g.q}</p>
                    <p style={{fontSize:12,color:"#888",margin:"0 0 8px 0"}}>（{g.jp}）</p>
                    <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                      {g.choices.map(c=>{
                        let bg="#f5f5f5",border="#ddd",color="#333";
                        if(selected){ if(c===g.correct){bg="#e8f5e9";border="#43a047";color="#2e7d32";}
                          else if(c===selected){bg="#ffebee";border="#e53935";color="#c62828";} }
                        return <button key={c} onClick={()=>handleGrammar(g.id,c)}
                          style={{background:bg,border:`2px solid ${border}`,color,padding:"8px 18px",borderRadius:10,fontSize:15,cursor:selected?"default":"pointer",fontWeight:"bold"}}>{c}</button>;
                      })}
                    </div>
                    {selected && <p style={{fontSize:13,fontWeight:"bold",color:isCorrect?"#43a047":"#e53935",marginTop:6}}>{isCorrect?"✓ 正解！":"✗ 正解は「"+g.correct+"」"}</p>}
                  </div>
                );
              })}
            </div>

            {/* 単語マッチング（5問） */}
            <div style={{background:"white",borderRadius:14,marginBottom:14,padding:"14px 12px",boxShadow:"0 2px 6px rgba(0,0,0,0.07)",border:"2px solid #e1bee7"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                <p style={{fontSize:14,fontWeight:"bold",color:"#7b1fa2",margin:0}}>📝 単語マッチング</p>
                <span style={{background:"#7b1fa2",color:"white",borderRadius:20,padding:"3px 12px",fontSize:13,fontWeight:"bold"}}>{vocabScore} / 5</span>
              </div>
              <p style={{fontSize:12,color:"#888",marginBottom:12}}>英語 → 日本語の意味をタップして繋げよう！</p>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                <div>
                  {vocabPool.map(v=>{
                    const matched=vocabMatched[v.id];
                    const sel=vocabSelected.left===v.id;
                    return <button key={v.id} onClick={()=>handleVocabLeft(v.id)}
                      style={{display:"block",width:"100%",marginBottom:6,padding:"10px 8px",borderRadius:10,fontSize:14,fontWeight:"bold",cursor:matched?"default":"pointer",textAlign:"center",
                        background:matched?"#e8f5e9":sel?"#fff9c4":"#f5f5f5",
                        border:`2px solid ${matched?"#43a047":sel?"#f9a825":"#ddd"}`,
                        color:matched?"#2e7d32":sel?"#f57f17":"#333",opacity:matched?0.7:1}}>
                      {v.en}{matched?" ✓":""}
                    </button>;
                  })}
                </div>
                <div>
                  {shuffledVocabJp.map(v=>{
                    const matched=vocabMatched[`jp_${v.id}`];
                    const sel=vocabSelected.right===v.id;
                    return <button key={v.id} onClick={()=>handleVocabRight(v.id)}
                      style={{display:"block",width:"100%",marginBottom:6,padding:"10px 8px",borderRadius:10,fontSize:14,fontWeight:"bold",cursor:matched?"default":"pointer",textAlign:"center",
                        background:matched?"#e8f5e9":sel?"#fff9c4":"#f5f5f5",
                        border:`2px solid ${matched?"#43a047":sel?"#f9a825":"#ddd"}`,
                        color:matched?"#2e7d32":sel?"#f57f17":"#333",opacity:matched?0.7:1}}>
                      {v.jp}{matched?" ✓":""}
                    </button>;
                  })}
                </div>
              </div>
              {vocabScore===5 && <p style={{textAlign:"center",fontSize:15,fontWeight:"bold",color:"#43a047",marginTop:10}}>🎉 全問正解！Perfect!</p>}
            </div>

            {/* エラー表示 */}
            {submitError && (
              <div style={{background:"#ffebee",border:"1px solid #e53935",borderRadius:10,padding:"10px 14px",marginBottom:8,fontSize:13,color:"#c62828"}}>
                ⚠️ {submitError}　もう一度試してね。
              </div>
            )}
            {/* 提出ボタン */}
            <button onClick={handleSubmit} disabled={submitting}
              style={{width:"100%",background:submitting?"#90a4ae":"linear-gradient(135deg,#1a73e8,#0d47a1)",color:"white",border:"none",padding:"18px",borderRadius:16,fontSize:17,cursor:submitting?"default":"pointer",fontWeight:"bold",boxShadow:submitting?"none":"0 4px 14px rgba(26,115,232,0.4)",marginTop:4,transition:"all 0.2s"}}>
              {submitting ? "⏳ 送信中..." : "📬 できた！提出する"}
            </button>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App/>, document.getElementById("root"));
  </script>
</body>
</html>
