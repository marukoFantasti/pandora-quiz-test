function DrawCanvas({ id, height=120, label, canvasRef: externalRef, internalHeight=150 }) {
  const internalRef = React.useRef(null);
  const canvasRef = externalRef || internalRef;
  const isDrawing = React.useRef(false);
  const lastPos = React.useRef(null);
  const [hasDrawing, setHasDrawing] = React.useState(false);
  const [isEraser, setIsEraser] = React.useState(false);
  const getPos=(e,canvas)=>{const rect=canvas.getBoundingClientRect();const sx=canvas.width/rect.width,sy=canvas.height/rect.height;if(e.touches)return{x:(e.touches[0].clientX-rect.left)*sx,y:(e.touches[0].clientY-rect.top)*sy};return{x:(e.clientX-rect.left)*sx,y:(e.clientY-rect.top)*sy};};
  React.useEffect(()=>{const canvas=canvasRef.current;const ctx=canvas.getContext("2d");ctx.fillStyle="#fffde7";ctx.fillRect(0,0,canvas.width,canvas.height);const onTS=(e)=>{e.preventDefault();isDrawing.current=true;lastPos.current=getPos(e,canvas);setHasDrawing(true);};const onTM=(e)=>{e.preventDefault();if(!isDrawing.current)return;const pos=getPos(e,canvas);const c2=canvas.getContext("2d");if(eraserRef.current){c2.globalCompositeOperation="destination-out";c2.lineWidth=30;}else{c2.globalCompositeOperation="source-over";c2.strokeStyle="#1a237e";c2.lineWidth=3;}c2.lineCap="round";c2.lineJoin="round";c2.beginPath();c2.moveTo(lastPos.current.x,lastPos.current.y);c2.lineTo(pos.x,pos.y);c2.stroke();lastPos.current=pos;};const onTE=(e)=>{e.preventDefault();isDrawing.current=false;};canvas.addEventListener("touchstart",onTS,{passive:false});canvas.addEventListener("touchmove",onTM,{passive:false});canvas.addEventListener("touchend",onTE,{passive:false});return()=>{canvas.removeEventListener("touchstart",onTS);canvas.removeEventListener("touchmove",onTM);canvas.removeEventListener("touchend",onTE);};},[]); 
  const eraserRef = React.useRef(false);
  const sd=(e)=>{isDrawing.current=true;lastPos.current=getPos(e,canvasRef.current);setHasDrawing(true);};
  const dr=(e)=>{if(!isDrawing.current)return;const c=canvasRef.current;const ctx=c.getContext("2d");const pos=getPos(e,c);if(eraserRef.current){ctx.globalCompositeOperation="destination-out";ctx.lineWidth=30;}else{ctx.globalCompositeOperation="source-over";ctx.strokeStyle="#1a237e";ctx.lineWidth=3;}ctx.lineCap="round";ctx.lineJoin="round";ctx.beginPath();ctx.moveTo(lastPos.current.x,lastPos.current.y);ctx.lineTo(pos.x,pos.y);ctx.stroke();lastPos.current=pos;};
  const sp=()=>{isDrawing.current=false;};
  const clear=()=>{const c=canvasRef.current;const ctx=c.getContext("2d");ctx.globalCompositeOperation="source-over";ctx.fillStyle="#fffde7";ctx.fillRect(0,0,c.width,c.height);setHasDrawing(false);};
  const toggleEraser=()=>{eraserRef.current=!eraserRef.current;setIsEraser(eraserRef.current);};
  return (
    <div style={{marginTop:10}}>
      {label&&<p style={{fontSize:12,color:"#5c6bc0",fontWeight:"bold",margin:"0 0 5px 0"}}>{label}</p>}
      <canvas ref={canvasRef} width={1200} height={300} onMouseDown={sd} onMouseMove={dr} onMouseUp={sp} onMouseLeave={sp}
        style={{width:"100%",height:internalHeight,border:isEraser?"2px dashed #e74c3c":"2px dashed #9fa8da",borderRadius:10,background:"#fffde7",display:"block",touchAction:"none",cursor:isEraser?"cell":"crosshair"}}/>
      <div style={{display:"flex",gap:6,marginTop:4}}>
        <button onClick={toggleEraser} style={{background:isEraser?"#ffeaa7":"#f5f5f5",border:isEraser?"1px solid #e74c3c":"1px solid #ddd",color:isEraser?"#e74c3c":"#666",padding:"3px 10px",borderRadius:6,fontSize:11,cursor:"pointer"}}>{isEraser?"✏️ ペン":"🧹 消しゴム"}</button>
        {hasDrawing&&<button onClick={clear} style={{background:"#f5f5f5",border:"1px solid #ddd",color:"#666",padding:"3px 10px",borderRadius:6,fontSize:11,cursor:"pointer"}}>🗑️ 全消し</button>}
      </div>
    </div>
  );
}

function TeacherCanvas({pid, gradeState, setGradeState}) {
  const canvasRef = React.useRef(null);
  const isDrawing = React.useRef(false);
  const lastPos = React.useRef(null);
  const eraserRef = React.useRef(false);
  const [isEraser, setIsEraser] = React.useState(false);

  const getPos=(e,canvas)=>{const rect=canvas.getBoundingClientRect();const sx=canvas.width/rect.width,sy=canvas.height/rect.height;if(e.touches)return{x:(e.touches[0].clientX-rect.left)*sx,y:(e.touches[0].clientY-rect.top)*sy};return{x:(e.clientX-rect.left)*sx,y:(e.clientY-rect.top)*sy};};

  React.useEffect(()=>{
    const canvas=canvasRef.current;
    const ctx=canvas.getContext('2d');
    ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
    const onTS=(e)=>{e.preventDefault();isDrawing.current=true;lastPos.current=getPos(e,canvas);};
    const onTM=(e)=>{e.preventDefault();if(!isDrawing.current)return;draw(e,canvas);};
    const onTE=(e)=>{e.preventDefault();isDrawing.current=false;saveCanvas();};
    canvas.addEventListener('touchstart',onTS,{passive:false});
    canvas.addEventListener('touchmove',onTM,{passive:false});
    canvas.addEventListener('touchend',onTE,{passive:false});
    return()=>{canvas.removeEventListener('touchstart',onTS);canvas.removeEventListener('touchmove',onTM);canvas.removeEventListener('touchend',onTE);};
  },[]);

  const draw=(e,canvas)=>{
    const ctx=canvas.getContext('2d');
    const pos=getPos(e,canvas);
    if(eraserRef.current){ctx.globalCompositeOperation='destination-out';ctx.lineWidth=40;}
    else{ctx.globalCompositeOperation='source-over';ctx.strokeStyle='#e74c3c';ctx.lineWidth=5;}
    ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(lastPos.current.x,lastPos.current.y);ctx.lineTo(pos.x,pos.y);ctx.stroke();
    lastPos.current=pos;
  };

  const saveCanvas=()=>{
    setGradeState(prev=>({...prev,[pid]:{...prev[pid],teacher_canvas:canvasRef.current.toDataURL()}}));
  };

  const clear=()=>{const c=canvasRef.current;const ctx=c.getContext('2d');ctx.globalCompositeOperation='source-over';ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);saveCanvas();};
  const toggleEraser=()=>{eraserRef.current=!eraserRef.current;setIsEraser(eraserRef.current);};

  return (
    <div style={{padding:'8px 16px',borderTop:'1px solid #2e3350',background:'rgba(255,255,255,0.01)'}}>
      <div style={{fontSize:10,color:'#5a6080',marginBottom:4}}>📝 先生のコメント（手書き）</div>
      <canvas ref={canvasRef} width={1200} height={150}
        onMouseDown={e=>{isDrawing.current=true;lastPos.current=getPos(e,canvasRef.current);}}
        onMouseMove={e=>{if(!isDrawing.current)return;draw(e,canvasRef.current);}}
        onMouseUp={()=>{isDrawing.current=false;saveCanvas();}}
        onMouseLeave={()=>{isDrawing.current=false;saveCanvas();}}
        style={{width:'100%',height:75,border:isEraser?'1px dashed #e74c3c':'1px dashed #cd4f7c',borderRadius:6,background:'#fff',display:'block',touchAction:'none',cursor:isEraser?'cell':'crosshair'}}/>
      <div style={{display:'flex',gap:6,marginTop:4}}>
        <button onClick={toggleEraser} style={{background:isEraser?'#ffeaa7':'var(--border)',border:isEraser?'1px solid #e74c3c':'none',color:isEraser?'#e74c3c':'var(--text2)',padding:'3px 10px',borderRadius:6,fontSize:11,cursor:'pointer'}}>{isEraser?'✏️ ペン':'🧹 消しゴム'}</button>
        <button onClick={clear} style={{background:'var(--border)',border:'none',color:'var(--text2)',padding:'3px 10px',borderRadius:6,fontSize:11,cursor:'pointer'}}>🗑️ 消す</button>
      </div>
    </div>
  );
}

                  </div>
                  <div style={{padding:'12px 16px'}}>
                    <div style={{fontSize:10,fontWeight:700,color:'#5a6080',marginBottom:8,letterSpacing:'0.08em'}}>生徒の答え</div>
                    {p.answer_canvas&&p.answer_canvas!=='null'
                      ?<img src={p.answer_canvas} alt="答え" style={{width:'100%',height:150,objectFit:'contain',objectPosition:'left',borderRadius:6,border:'1px solid #2e3350',background:'#fffde7'}}/>
                      :<div style={{height:150,border:'1px solid #2e3350',borderRadius:6,display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,color:'#5a6080',fontStyle:'italic'}}>未記入</div>}
                  </div>
                </div>
                <div style={{padding:'10px 16px',borderTop:'1px solid #2e3350',display:'flex',alignItems:'center',gap:8,background:'rgba(255,255,255,0.01)',flexWrap:'wrap'}}>
                  {[['correct','✓ 正解','#2ecc71'],['partial','△ 式のみ','#f39c12'],['incorrect','✗ 不正解','#e74c3c']].map(([val,label,color])=>(
                    <button key={val} onClick={()=>setGrade(pid,val)} style={{padding:'5px 12px',borderRadius:8,border:'1px solid '+color,cursor:'pointer',fontSize:11,fontWeight:700,background:gs.result===val?color:'transparent',color:gs.result===val?(val==='incorrect'?'#fff':'#000'):color,fontFamily:'inherit'}}>{label}</button>
                  ))}
                  <input placeholder="メモ" value={gs.note||''} onChange={e=>setNote(pid,e.target.value)} style={{flex:1,minWidth:120,background:'#0f1117',border:'1px solid #2e3350',borderRadius:6,padding:'5px 10px',fontSize:11,color:'#f0f2ff',fontFamily:'inherit',outline:'none'}}/>
                </div>
                <TeacherCanvas pid={String(pid)} gradeState={gradeState} setGradeState={setGradeState}/>
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  if(submitted){
    return (
      <div style={{minHeight:"100vh",background:"#f0f4ff",paddingBottom:40}}>
        <div style={{background:"linear-gradient(135deg,#1a9fd4,#0277bd)",color:"white",padding:"20px 16px"}}>
          <h1 style={{fontSize:18,fontWeight:"bold",margin:"0 0 4px 0"}}>✅ 提出完了！ / Submitted!</h1>
          <p style={{fontSize:12,margin:0,opacity:0.85}}>先生に届いたよ！Well done! 🎉</p>
        </div>
        <div style={{padding:"14px 12px"}}>
          {questions.map((q,idx)=>{
            const lb=LEVEL_BADGE[q.level]||{};const uc=UNIT_COLORS[q.unit]||{color:"#555",bg:"#f5f5f5"};
            return (
              <div key={q.id} style={{background:"white",borderRadius:14,marginBottom:10,padding:"12px",border:"2px solid #dde3f0",boxShadow:"0 2px 6px rgba(0,0,0,0.06)"}}>
                <div style={{display:"flex",gap:5,marginBottom:6,flexWrap:"wrap"}}>
                  <span style={{background:"#1a9fd4",color:"white",borderRadius:6,padding:"2px 8px",fontSize:12,fontWeight:"bold"}}>Q{idx+1}</span>
                  <span style={{background:uc.bg,color:uc.color,borderRadius:6,padding:"2px 8px",fontSize:11}}>{q.unit}</span>
                  <span style={{background:lb.bg,color:lb.color,borderRadius:6,padding:"2px 8px",fontSize:11,fontWeight:"bold"}}>{lb.label}</span>
                </div>
                {eqRefs.current[q.id]?.current&&<img src={eqRefs.current[q.id].current.toDataURL()} style={{width:"100%",borderRadius:8,border:"1px solid #ddd",marginBottom:4}}/>}
                {ansRefs.current[q.id]?.current&&<img src={ansRefs.current[q.id].current.toDataURL()} style={{width:"100%",borderRadius:8,border:"1px solid #ddd"}}/>}
              </div>
            );
          })}
          <button onClick={()=>setSubmitted(false)} style={{width:"100%",background:"#f5f5f5",border:"2px solid #ddd",color:"#666",padding:"13px",borderRadius:14,fontSize:14,cursor:"pointer",fontWeight:"bold"}}>← 戻る / Go back</button>
        </div>
      </div>
    );
  }

  return (
    <div style={{minHeight:"100vh",background:"#f0f4ff",paddingBottom:100,overflowX:"hidden"}}>
      <div style={{background:"linear-gradient(135deg,#1a9fd4,#0277bd)",color:"white",padding:"16px 16px 12px",position:"sticky",top:0,zIndex:100,boxShadow:"0 2px 10px rgba(0,0,0,0.2)"}}>
        <h1 style={{fontSize:16,fontWeight:"bold",margin:"0 0 3px 0"}}>🔵 算数で日本語を学ぼう！</h1>
        <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
          <span style={{background:"rgba(255,255,255,0.2)",borderRadius:6,padding:"2px 8px",fontSize:11}}>ドラえもん</span>
          <span style={{background:"rgba(255,255,255,0.2)",borderRadius:6,padding:"2px 8px",fontSize:11}}>N4</span>
          <span style={{background:"rgba(255,255,255,0.2)",borderRadius:6,padding:"2px 8px",fontSize:11}}>小4</span>
          <span style={{background:"rgba(255,255,255,0.15)",borderRadius:6,padding:"2px 8px",fontSize:11}}>10問</span>
        </div>
      </div>

      <div style={{padding:"12px"}}>
        <div style={{background:"white",borderRadius:14,marginBottom:14,border:"2px solid #1a9fd4",overflow:"hidden",boxShadow:"0 2px 6px rgba(0,0,0,0.07)"}}>
          <div style={{padding:"12px"}}>
            <p style={{fontSize:14,fontWeight:"bold",color:"#1a9fd4",margin:"0 0 2px 0"}}>✏️ なまえ / Your name</p>
            <DrawCanvas id="name" height={70} label={null} canvasRef={nameCanvasRef}/>
          </div>
        </div>

        {questions.map((q,idx)=>{
          const lb=LEVEL_BADGE[q.level]||{label:q.level,color:"#888",bg:"#f5f5f5"};
          const uc=UNIT_COLORS[q.unit]||{color:"#555",bg:"#f5f5f5"};
          return (
            <div key={q.id} style={{background:"white",borderRadius:14,marginBottom:14,border:"2px solid #dde3f0",overflow:"hidden",boxShadow:"0 2px 6px rgba(0,0,0,0.07)"}}>
              <div style={{background:"linear-gradient(90deg,#1a9fd4,#0277bd)",padding:"8px 14px",display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
                <span style={{background:"white",color:"#0277bd",borderRadius:6,padding:"2px 8px",fontSize:12,fontWeight:"bold"}}>Q{idx+1}</span>
                <span style={{background:uc.bg,color:uc.color,borderRadius:6,padding:"2px 8px",fontSize:11,fontWeight:"bold"}}>{q.unit}</span>
                <span style={{background:lb.bg,color:lb.color,borderRadius:6,padding:"2px 8px",fontSize:11,fontWeight:"bold"}}>{lb.label}</span>
              </div>

              <div style={{padding:"14px 12px"}}>
                <div style={{display:"flex",gap:10,alignItems:"flex-start",marginBottom:12}}>
                  <div style={{flexShrink:0}}>{illustrations[q.id]}</div>
                  <p style={{fontSize:15,lineHeight:2.1,color:"#1a1a1a",fontWeight:"500",margin:0,wordBreak:"break-word"}}>{q.jp}</p>
                </div>

                <button onClick={()=>speak(q.reading)}
                  style={{background:speaking===q.reading?"#e3f2fd":"#f5f5f5",border:`1px solid ${speaking===q.reading?"#1a9fd4":"#ddd"}`,color:speaking===q.reading?"#1a9fd4":"#666",padding:"5px 12px",borderRadius:8,fontSize:12,cursor:"pointer",marginBottom:12}}>
                  {speaking===q.reading?"🔊 Playing...":"🔊 読んでみよう / Read aloud"}
                </button>

                <DrawCanvas id={`eq_${q.id}`} height={225} internalHeight={225} label="📐 式を書こう / Write your equation" canvasRef={eqRefs.current[q.id]}/>
                <DrawCanvas id={`ans_${q.id}`} height={110} label="✍️ 答えを書こう / Write your answer" canvasRef={ansRefs.current[q.id]}/>

                <div style={{display:"flex",gap:8,marginTop:12,flexWrap:"wrap"}}>
                  <button onClick={()=>setShowWords(p=>({...p,[q.id]:!p[q.id]}))}
                    style={{background:showWords[q.id]?"#fff3e0":"#f5f5f5",border:`1px solid ${showWords[q.id]?"#ff9800":"#ddd"}`,color:showWords[q.id]?"#e65100":"#666",padding:"6px 12px",borderRadius:8,fontSize:12,cursor:"pointer"}}>
                    📖 ことば / Words
                  </button>
                  <button onClick={()=>setShowHint(p=>({...p,[q.id]:!p[q.id]}))}
                    style={{background:showHint[q.id]?"#e8f5e9":"#f5f5f5",border:`1px solid ${showHint[q.id]?"#43a047":"#ddd"}`,color:showHint[q.id]?"#2e7d32":"#666",padding:"6px 12px",borderRadius:8,fontSize:12,cursor:"pointer"}}>
                    🇬🇧 English hint
                  </button>

                </div>
              </div>

              {showWords[q.id]&&(
                <div style={{borderTop:"1px solid #fff3e0",background:"#fffbf0",padding:"12px"}}>
                  <p style={{fontSize:11,color:"#e65100",fontWeight:"bold",margin:"0 0 8px 0"}}>📖 ことば / Words</p>
                  {q.words.map((w,i)=>(
                    <div key={i} style={{background:"white",border:"1px solid #ffe0b2",borderRadius:10,padding:"8px 10px",marginBottom:6}}>
                      <p style={{fontSize:14,fontWeight:"bold",color:"#333",margin:"0 0 2px 0"}}>{w.word}</p>
                      <p style={{fontSize:13,color:"#1a73e8",margin:"0 0 2px 0"}}>🇬🇧 {w.meaning}</p>
                      <p style={{fontSize:11,color:"#888",margin:0}}>例: {w.example}</p>
                    </div>
                  ))}
                </div>
              )}
              {showHint[q.id]&&(
                <div style={{borderTop:"1px solid #e8f5e9",background:"#f1f8f1",padding:"12px"}}>
                  <p style={{fontSize:11,color:"#2e7d32",fontWeight:"bold",margin:"0 0 4px 0"}}>🇬🇧 English hint</p>
                  <p style={{fontSize:14,color:"#333",margin:0,fontStyle:"italic"}}>{q.hint}</p>
                </div>
              )}

            </div>
          );
        })}

        {/* 今日の漢字コーナー */}
        <div style={{background:"linear-gradient(135deg,#e65100,#bf360c)",borderRadius:14,padding:"14px 16px",marginBottom:12}}>
          <h2 style={{color:"white",fontSize:16,fontWeight:"bold",margin:"0 0 2px 0"}}>🈳 今日の漢字 / Today's Kanji 🔵</h2>
          <p style={{color:"rgba(255,255,255,0.8)",fontSize:12,margin:0}}>距・倍・計　選んで、書いてみよう！</p>
        </div>

        {kanjiQuiz.map(k=>{
          const selected=kanjiAnswers[k.id];const isCorrect=selected===k.correct;
          return (
            <div key={k.id} style={{background:"white",borderRadius:14,marginBottom:14,border:`2px solid ${selected?(isCorrect?"#43a047":"#e53935"):"#dde3f0"}`,overflow:"hidden",boxShadow:"0 2px 6px rgba(0,0,0,0.07)"}}>
              <div style={{padding:"14px 12px"}}>
                <div style={{display:"flex",gap:6,marginBottom:10}}>
                  <span style={{background:"#e65100",color:"white",borderRadius:6,padding:"2px 8px",fontSize:12,fontWeight:"bold"}}>漢字</span>
                </div>
                <div style={{display:"flex",gap:12,alignItems:"center",marginBottom:10}}>
                  <div style={{flexShrink:0}}><KanjiIllustration id={k.id}/></div>
                  <div>
                    <p style={{fontSize:18,fontWeight:"bold",color:"#222",margin:"0 0 6px 0"}}>{k.en} = {k.reading}</p>
                    <p style={{fontSize:13,color:"#888",margin:0,fontStyle:"italic"}}>{k.hint}</p>
                  </div>
                </div>
                <p style={{fontSize:14,color:"#333",margin:"0 0 10px 0",fontWeight:"bold"}}>「{k.reading}」の漢字はどれ？ / Which kanji?</p>
                <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:10}}>
                  {k.choices.map(choice=>{
                    let bg="#f5f5f5",border="#ddd",color="#333";
                    if(selected){if(choice===k.correct){bg="#e8f5e9";border="#43a047";color="#2e7d32";}else if(choice===selected&&choice!==k.correct){bg="#ffebee";border="#e53935";color="#c62828";}}
                    return <button key={choice} onClick={()=>handleKanji(k.id,choice)}
                      style={{background:bg,border:`2px solid ${border}`,color,padding:"12px 16px",borderRadius:10,fontSize:20,cursor:selected?"default":"pointer",fontWeight:"bold",minWidth:70}}>{choice}</button>;
                  })}
                </div>
                {selected&&<p style={{fontSize:14,fontWeight:"bold",color:isCorrect?"#43a047":"#e53935",marginBottom:10}}>{isCorrect?"✓ 正解！Correct! 🎉":`✗ 正解は「${k.correct}」/ The answer is「${k.correct}」`}</p>}
                <DrawCanvas id={k.id} height={160} label="✍️ 書いてみよう！/ Let's write it!" canvasRef={kanjiRefs.current[k.id]}/>
              </div>
            </div>
          );
        })}

        {submitError&&<div style={{background:"#ffebee",border:"1px solid #e53935",borderRadius:10,padding:"10px 14px",marginBottom:8,fontSize:13,color:"#c62828"}}>⚠️ {submitError}</div>}
        <button onClick={handleSubmit} disabled={submitting}
          style={{width:"100%",background:submitting?"#90a4ae":"linear-gradient(135deg,#1a9fd4,#0277bd)",color:"white",border:"none",padding:"17px",borderRadius:16,fontSize:16,cursor:submitting?"default":"pointer",fontWeight:"bold",boxShadow:submitting?"none":"0 4px 14px rgba(26,159,212,0.4)",transition:"all 0.2s"}}>
          {submitting?"⏳ Submitting...":"📬 できた！提出する / Submit!"}
        </button>
      </div>
    </div>
  );
}

ReactDOM.render(React.createElement(App), document.getElementById("root"));
</script>
</body>
</html>
